{% load i18n %}
<div class="card" id="nabradio-settings">
  <form id="nabradio-settings-form" action="/nabradio/settings" method="POST">
    {% csrf_token %}
    <div class="card-header">
      <h5 class="card-title">{% trans "Webradio Settings" %}</h5>
    </div>
    <div class="card-body">
      <!-- Champ pour ajouter une nouvelle webradio -->
      <div class="form-group">
        <label for="newWebradioInput">{% trans "Add a new webradio" %}</label>
        <div class="input-group">
          <input type="text" class="form-control" id="newWebradioInput" name="new_webradio" placeholder="{% trans 'Enter webradio URL or name' %}">
          <div class="input-group-append">
            <button class="btn btn-outline-secondary" type="button" id="addWebradioBtn">{% trans "Add" %}</button>
          </div>
        </div>
      </div>
      
      <!-- Liste des webradios enregistrées -->
      <div class="form-group">
        <label>{% trans "Saved Webradios" %}</label>
        <ul class="list-group" id="webradioList">
          {% for radio in config.radio_list %}
            <li class="list-group-item d-flex justify-content-between align-items-center radio-item" data-radio-id="{{ radio.id }}">
              <span class="radio-name">{{ radio.name }}</span>
              <div>
                <button type="button" class="btn btn-sm btn-success play-btn">{% trans "Play" %}</button>
                <button type="button" class="btn btn-sm btn-warning stop-btn">{% trans "Stop" %}</button>
                <button type="button" class="btn btn-sm btn-danger delete-btn">{% trans "Delete" %}</button>
              </div>
            </li>
          {% empty %}
            <li class="list-group-item">{% trans "No webradios saved." %}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
    <div class="card-footer">
      <div class="row">
        <div class="col-12 text-right">
          <button type="submit" class="btn btn-primary">{% trans "Save Changes" %}</button>
        </div>
      </div>
    </div>
  </form>

  <!-- Modal de confirmation de suppression -->
  <div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteConfirmModalLabel">{% trans "Confirm Deletion" %}</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="{% trans 'Close' %}">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          {% trans "Are you sure you want to delete this webradio?" %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">{% trans "Cancel" %}</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">{% trans "Delete" %}</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts pour la gestion AJAX et l'interactivité -->
  <script type="text/javascript">
    $(document).ready(function(){
      // Ajouter une nouvelle webradio
      $('#addWebradioBtn').click(function(){
        var newRadio = $('#newWebradioInput').val().trim();
        if(newRadio !== ""){
          // Crée un nouvel élément dans la liste (l'ID est temporaire ici, à remplacer par la valeur renvoyée par le serveur)
          var newId = Date.now(); 
          var listItem = $('<li class="list-group-item d-flex justify-content-between align-items-center radio-item" data-radio-id="'+newId+'">')
            .append('<span class="radio-name">'+newRadio+'</span>')
            .append(
              '<div>' +
              '<button type="button" class="btn btn-sm btn-success play-btn">{% trans "Play" %}</button> ' +
              '<button type="button" class="btn btn-sm btn-warning stop-btn">{% trans "Stop" %}</button> ' +
              '<button type="button" class="btn btn-sm btn-danger delete-btn">{% trans "Delete" %}</button>' +
              '</div>'
            );
          $('#webradioList').append(listItem);
          $('#newWebradioInput').val('');
          // Vous pouvez ici envoyer une requête AJAX pour persister la nouvelle entrée
        }
      });

      var radioToDelete = null;
      // Lors du clic sur "Delete", afficher le modal de confirmation
      $('#webradioList').on('click', '.delete-btn', function(){
        radioToDelete = $(this).closest('.radio-item');
        $('#deleteConfirmModal').modal('show');
      });

      // Confirmer la suppression
      $('#confirmDeleteBtn').click(function(){
        if(radioToDelete){
          var radioId = radioToDelete.data('radio-id');
          $.ajax({
            url: '/nabradio/delete/',
            method: 'POST',
            data: { 
              'radio_id': radioId, 
              'csrfmiddlewaretoken': $('input[name="csrfmiddlewaretoken"]').val() 
            },
            success: function(){
              radioToDelete.remove();
              $('#deleteConfirmModal').modal('hide');
            },
            error: function(){
              alert("{% trans 'Error deleting webradio' %}");
              $('#deleteConfirmModal').modal('hide');
            }
          });
        }
      });

      // Bouton "Play"
      $('#webradioList').on('click', '.play-btn', function(){
        var radioItem = $(this).closest('.radio-item');
        var radioId = radioItem.data('radio-id');
        $.ajax({
          url: '/nabradio/control/',
          method: 'PUT',
          data: { 
            'action': 'play', 
            'radio_id': radioId, 
            'csrfmiddlewaretoken': $('input[name="csrfmiddlewaretoken"]').val() 
          },
          success: function(){
            $.bootstrapGrowl("{% trans 'Playing webradio' %}", {type: 'success'});
          },
          error: function(){
            $.bootstrapGrowl("{% trans 'Error playing webradio' %}", {type: 'danger'});
          }
        });
      });

      // Bouton "Stop"
      $('#webradioList').on('click', '.stop-btn', function(){
        var radioItem = $(this).closest('.radio-item');
        var radioId = radioItem.data('radio-id');
        $.ajax({
          url: '/nabradio/control/',
          method: 'PUT',
          data: { 
            'action': 'stop', 
            'radio_id': radioId, 
            'csrfmiddlewaretoken': $('input[name="csrfmiddlewaretoken"]').val() 
          },
          success: function(){
            $.bootstrapGrowl("{% trans 'Stopped webradio' %}", {type: 'success'});
          },
          error: function(){
            $.bootstrapGrowl("{% trans 'Error stopping webradio' %}", {type: 'danger'});
          }
        });
      });
    });
  </script>
</div>
