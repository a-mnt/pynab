{% load i18n static %}
{# Ears tile of the home page: the rabbit seen from the front, each ear dragged along its path. #}
<style>
  .nab-ears-stage {
    display: block;
    width: 100%;
    max-width: 380px;
    height: auto;
    margin: 0 auto;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .nab-ears-floor {
    stroke: #e5e7eb;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* Path followed by the tip of each ear, with its 17 positions */
  .nab-ears-track {
    fill: none;
    stroke: #e5e7eb;
    stroke-width: 1.5;
    stroke-dasharray: 3 5;
  }

  .nab-ears-tick {
    fill: #d5d9e3;
  }

  .nab-ears-tick.is-zero {
    fill: #6b7280;
  }

  .nab-ears-tick.is-current {
    fill: #3341b5;
  }

  .nab-ears-body {
    fill: #fff;
    stroke: #b9c1d3;
    stroke-width: 4;
    stroke-linejoin: round;
  }

  .nab-ears-body-fill {
    fill: #fff;
  }

  .nab-ears-face {
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .nab-ears-edge {
    stroke: #b9c1d3;
    stroke-linecap: round;
  }

  .nab-ears-fill {
    stroke: #fff;
    stroke-linecap: round;
  }

  .nab-ears-fill.is-broken {
    stroke: #e5e7eb;
  }

  /* Position aimed at while dragging and while the ear turns */
  .nab-ears-ghost {
    stroke: #3341b5;
    stroke-opacity: 0.22;
    stroke-linecap: round;
    pointer-events: none;
  }

  /* Invisible, finger-sized grips: the page still scrolls everywhere else */
  .nab-ears-grip {
    stroke: transparent;
    fill: transparent;
    stroke-linecap: round;
    cursor: grab;
    touch-action: none;
  }

  .js-ears.is-locked .nab-ears-grip {
    cursor: default;
  }

  .nab-ears-link {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    margin: 4px 0 0;
    font-size: 0.95rem;
    color: #1f2937;
    cursor: pointer;
  }

  .nab-ears-link input {
    width: 20px;
    height: 20px;
    accent-color: #3341b5;
  }

  .nab-ears-presets {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 4px;
  }

  .nab-ears-note {
    min-height: 1.5em;
    margin: 12px 0 0;
    font-size: 0.9rem;
    color: #6b7280;
  }

  .nab-ears-note.is-warning {
    color: #b45309;
    font-weight: 600;
  }
</style>

<div
  class="nab-card js-ears"
  data-url="{% url 'nabweb.ears' %}"
  data-csrf="{{ csrf_token }}"
  data-face="{% static 'nabweb/icons/icon-192.png' %}"
  data-state="{{ rabbit_state|default:'' }}"
  data-left="{% if ears.left.position is not None %}{{ ears.left.position }}{% endif %}"
  data-right="{% if ears.right.position is not None %}{{ ears.right.position }}{% endif %}"
  data-left-working="{{ ears.left.working|yesno:'1,0' }}"
  data-right-working="{{ ears.right.working|yesno:'1,0' }}"
  data-text-moving="{% trans 'Les oreilles tournent…' %}"
  data-text-asleep="{% trans 'Le lapin dort : réveillez-le pour bouger ses oreilles.' %}"
  data-text-busy="{% trans 'Le lapin est occupé : les oreilles se commandent quand il est au repos.' %}"
  data-text-unreachable="{% trans 'Le lapin ne répond pas.' %}"
  data-text-help="{% trans 'Faites glisser une oreille le long de sa trajectoire, puis relâchez.' %}"
>
  <div class="nab-section-head">
    <h2 class="nab-section-title">{% trans "Oreilles" %}</h2>
  </div>

  <svg class="nab-ears-stage js-ears-stage" viewBox="0 40 320 212" role="img" aria-label="{% trans 'Position des oreilles du lapin' %}"></svg>

  <label class="nab-ears-link">
    <input type="checkbox" class="js-ears-linked">
    {% trans "Bouger les deux oreilles ensemble" %}
  </label>

  <div class="nab-ears-presets">
    <button type="button" class="btn btn-outline-primary js-ears-preset" data-left="0" data-right="0">
      {% trans "Dresser" %}
    </button>
    <button type="button" class="btn btn-outline-primary js-ears-preset" data-left="10" data-right="10">
      {% trans "Coucher" %}
    </button>
  </div>

  <p class="nab-ears-note js-ears-note" aria-live="polite"></p>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var STEPS = 17;            // positions in a full turn
    var STEP_MS = 170;         // on-screen time per position, close to the motor
    var DOWN = 10;             // position drawn flat, level with the ground
    var LENGTH = 70;           // length of an ear, in drawing units
    var FLAT = 0.32;           // width of the oval, relative to its length
    var BODY = 'M102 244 L119 150 A41.5 41.5 0 0 1 201 150 L218 244 Z';
    var SVG_NS = 'http://www.w3.org/2000/svg';

    var card = document.querySelector('.js-ears');
    if (!card) {
      return;
    }
    var svg = card.querySelector('.js-ears-stage');
    var note = card.querySelector('.js-ears-note');
    var linked = card.querySelector('.js-ears-linked');
    var presets = card.querySelectorAll('.js-ears-preset');
    var state = card.dataset.state || null;
    var moving = false;
    var frame = null;
    var lastTime = null;
    var dragging = null;

    // Where each ear is attached. "out" is the side it lies down on.
    // The rabbit is drawn with its left ear on the left of the screen:
    // swap the two entries if your rabbit does the opposite.
    var ears = {
      left: { x: 136, y: 128, out: -1 },
      right: { x: 184, y: 128, out: 1 }
    };
    var SIDES = ['left', 'right'];

    function text(name) {
      return card.getAttribute('data-text-' + name);
    }

    function el(tag, attributes, parent) {
      var element = document.createElementNS(SVG_NS, tag);
      for (var key in attributes) {
        element.setAttribute(key, attributes[key]);
      }
      parent.appendChild(element);
      return element;
    }

    // Slanted oval through the tip of the raised ear (position 0, straight
    // up) and the tip of the lowered ear (position DOWN, flat, outwards).
    function fit(ear, flat) {
      var turn = (DOWN / STEPS) * 2 * Math.PI;
      var dx = -ear.out * LENGTH;
      var dy = -LENGTH;
      var re = 1 - Math.cos(turn);
      var im = -Math.sin(turn) * flat;
      var norm = re * re + im * im;
      var px = (dx * re + dy * im) / norm;
      var py = (dy * re - dx * im) / norm;
      var sign = flat < 0 ? -1 : 1;
      ear.ox = ear.x - px;
      ear.oy = ear.y - LENGTH - py;
      ear.a = Math.hypot(px, py);
      ear.b = ear.a * FLAT;
      ear.ux = px / ear.a;
      ear.uy = py / ear.a;
      ear.vx = -ear.uy * sign;
      ear.vy = ear.ux * sign;
      // Positive when the ear goes down on the side of its attachment.
      return (ear.x - ear.ox) * ear.vx + (ear.y - ear.oy) * ear.vy;
    }

    function tip(ear, position) {
      var angle = (position / STEPS) * 2 * Math.PI;
      var c = ear.a * Math.cos(angle);
      var s = ear.b * Math.sin(angle);
      return [ear.ox + c * ear.ux + s * ear.vx, ear.oy + c * ear.uy + s * ear.vy];
    }

    // Position of the oval closest to a point of the drawing.
    function positionAt(ear, point) {
      var dx = point.x - ear.ox;
      var dy = point.y - ear.oy;
      var turn = Math.atan2((dx * ear.vx + dy * ear.vy) / ear.b, (dx * ear.ux + dy * ear.uy) / ear.a) / (2 * Math.PI);
      if (turn < 0) {
        turn += 1;
      }
      return Math.round(turn * STEPS) % STEPS;
    }

    /* ---------- Drawing ---------- */
    el('line', { x1: 60, y1: 244, x2: 260, y2: 244, 'class': 'nab-ears-floor' }, svg);
    SIDES.forEach(function(side) {
      var ear = ears[side];
      var raw = card.getAttribute('data-' + side);
      if (fit(ear, FLAT) < 0) {
        fit(ear, -FLAT);
      }
      // Unreachable rabbit: nothing is known, which is not "broken".
      ear.working = !state || card.getAttribute('data-' + side + '-working') === '1';
      ear.position = raw === '' ? null : parseInt(raw, 10);
      ear.current = ear.position || 0;   // drawn position, may be between two steps
      ear.target = ear.current;
      ear.ghost = null;
      ear.ticks = [];
      el('ellipse', {
        cx: ear.ox, cy: ear.oy, rx: ear.a, ry: ear.b,
        transform: 'rotate(' + (Math.atan2(ear.uy, ear.ux) * 180 / Math.PI) + ' ' + ear.ox + ' ' + ear.oy + ')',
        'class': 'nab-ears-track'
      }, svg);
      for (var i = 0; i < STEPS; i++) {
        var point = tip(ear, i);
        ear.ticks.push(el('circle', {
          cx: point[0], cy: point[1], r: i ? 3 : 4.6,
          'class': 'nab-ears-tick' + (i ? '' : ' is-zero')
        }, svg));
      }
    });
    // Outlines first, fills next: the base of the ears blends into the body.
    var edges = el('g', {}, svg);
    el('path', { d: BODY, 'class': 'nab-ears-body' }, svg);
    var fills = el('g', {}, svg);
    el('path', { d: BODY, 'class': 'nab-ears-body-fill' }, svg);
    // The face is the logo of the site.
    el('image', { href: card.dataset.face, x: 122.3, y: 137.1, width: 75.7, height: 75.7, 'class': 'nab-ears-face' }, svg);
    SIDES.forEach(function(side) {
      var ear = ears[side];
      ear.ghostLine = el('line', { x1: ear.x, y1: ear.y, 'stroke-width': 24, 'class': 'nab-ears-ghost', visibility: 'hidden' }, svg);
      ear.edge = el('line', { x1: ear.x, y1: ear.y, 'stroke-width': 24, 'class': 'nab-ears-edge' }, edges);
      ear.fill = el('line', { x1: ear.x, y1: ear.y, 'stroke-width': 20, 'class': 'nab-ears-fill' }, fills);
    });
    // Grips come last so that they sit above everything.
    SIDES.forEach(function(side) {
      var ear = ears[side];
      ear.ticks.forEach(function(dot) {
        el('circle', { cx: dot.getAttribute('cx'), cy: dot.getAttribute('cy'), r: 11, 'class': 'nab-ears-grip', 'data-side': side }, svg);
      });
      ear.grip = el('line', { x1: ear.x, y1: ear.y, 'stroke-width': 44, 'class': 'nab-ears-grip', 'data-side': side }, svg);
    });

    function draw() {
      SIDES.forEach(function(side) {
        var ear = ears[side];
        var point = tip(ear, ear.current);
        [ear.edge, ear.fill, ear.grip].forEach(function(line) {
          line.setAttribute('x2', point[0]);
          line.setAttribute('y2', point[1]);
        });
        ear.fill.classList.toggle('is-broken', !ear.working);
        var aim = ear.ghost !== null ? ear.ghost : (ear.current !== ear.target ? ear.target : null);
        ear.ghostLine.setAttribute('visibility', aim === null ? 'hidden' : 'visible');
        if (aim !== null) {
          var aimed = tip(ear, aim);
          ear.ghostLine.setAttribute('x2', aimed[0]);
          ear.ghostLine.setAttribute('y2', aimed[1]);
        }
        var lit = aim !== null ? aim : (ear.working && ear.position !== null ? ear.position : -1);
        ear.ticks.forEach(function(dot, index) {
          dot.classList.toggle('is-current', index === lit);
        });
      });
    }

    // The drawn ears turn like the real ones: always forward, one position
    // every STEP_MS.
    function animate(now) {
      var step = lastTime === null ? 0 : Math.min(now - lastTime, 100) / STEP_MS;
      var running = false;
      lastTime = now;
      SIDES.forEach(function(side) {
        var ear = ears[side];
        if (ear.current === ear.target) {
          return;
        }
        var remaining = ((ear.target - ear.current) % STEPS + STEPS) % STEPS;
        if (step >= remaining) {
          ear.current = ear.target;
        } else {
          ear.current = (ear.current + step) % STEPS;
          running = true;
        }
      });
      draw();
      if (running) {
        frame = requestAnimationFrame(animate);
      } else {
        frame = null;
        lastTime = null;
      }
    }

    // Show `position` for an ear. Returns how long the turn takes on screen.
    function show(ear, position, animated) {
      ear.position = (position === null || position === undefined) ? null : position;
      var target = ear.position || 0;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!animated || reduced) {
        ear.current = ear.target = target;
        draw();
        return 0;
      }
      ear.target = target;
      var delta = ((target - ear.current) % STEPS + STEPS) % STEPS;
      if (delta && frame === null) {
        frame = requestAnimationFrame(animate);
      }
      draw();
      return delta * STEP_MS;
    }

    function usable() {
      return state === 'idle' && !moving;
    }

    function refreshControls() {
      var anyWorking = ears.left.working || ears.right.working;
      card.classList.toggle('is-locked', !usable());
      Array.prototype.forEach.call(presets, function(button) {
        button.disabled = !(usable() && anyWorking);
      });
      linked.disabled = !(ears.left.working && ears.right.working);

      note.classList.remove('is-warning');
      if (moving) {
        note.textContent = text('moving');
      } else if (state === 'idle') {
        note.textContent = text('help');
      } else {
        note.classList.add('is-warning');
        note.textContent = text(!state ? 'unreachable' : (state === 'asleep' ? 'asleep' : 'busy'));
      }
    }

    // Apply what the rabbit reports.
    function apply(data, animated) {
      if (data.state !== undefined) {
        state = data.state;
      }
      if (data.ears) {
        SIDES.forEach(function(side) {
          ears[side].working = data.ears[side].working;
          show(ears[side], data.ears[side].position, animated);
        });
      }
    }

    function refresh() {
      if (moving || dragging) {
        return;
      }
      fetch(card.dataset.url, { credentials: 'same-origin', cache: 'no-store' })
        .then(function(response) { return response.json(); })
        .then(function(data) {
          if (moving || dragging) {
            return;
          }
          if (data.status === 'ok') {
            apply(data, true);
          } else {
            state = null;
          }
          refreshControls();
        })
        .catch(function() {});
    }

    function move(target) {
      if (!usable()) {
        return;
      }
      // Broken ears are left alone.
      var body = new URLSearchParams();
      var longest = 0;
      SIDES.forEach(function(side) {
        if (target[side] !== undefined && ears[side].working) {
          body.append(side, target[side]);
          // The drawing starts turning at once, like the real ear.
          longest = Math.max(longest, show(ears[side], target[side], true));
        }
      });
      if (!body.toString()) {
        return;
      }
      moving = true;
      refreshControls();
      var started = Date.now();

      fetch(card.dataset.url, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'X-CSRFToken': card.dataset.csrf },
        body: body
      })
        .then(function(response) { return response.json(); })
        .catch(function() { return { status: 'error' }; })
        .then(function(data) {
          // Let the drawing finish its turn before unlocking the controls.
          var wait = Math.max(0, longest - (Date.now() - started));
          setTimeout(function() {
            moving = false;
            if (data.status === 'ok') {
              apply(data, false);
            } else if (data.status === 'busy') {
              state = data.state;
              refresh();
            } else {
              if (window.jQuery && window.jQuery.bootstrapGrowl) {
                window.jQuery.bootstrapGrowl(data.message || text('unreachable'), { type: 'danger' });
              }
              refresh();
            }
            refreshControls();
          }, wait);
        });
    }

    /* ---------- Dragging an ear, with a finger or the mouse ---------- */
    function sideOf(event) {
      var side = event.target.getAttribute && event.target.getAttribute('data-side');
      return side && usable() && ears[side].working ? side : null;
    }

    function aim(event) {
      var point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      point = point.matrixTransform(svg.getScreenCTM().inverse());
      var position = positionAt(ears[dragging], point);
      SIDES.forEach(function(side) {
        var follows = side === dragging || (linked.checked && ears[side].working);
        ears[side].ghost = follows ? position : null;
      });
      draw();
    }

    function release(commit) {
      if (!dragging) {
        return;
      }
      var target = {};
      SIDES.forEach(function(side) {
        var ear = ears[side];
        // Releasing where the ear already is sends nothing.
        if (commit && ear.ghost !== null && ear.ghost !== ear.position) {
          target[side] = ear.ghost;
        }
        ear.ghost = null;
      });
      dragging = null;
      draw();
      move(target);
    }

    svg.addEventListener('pointerdown', function(event) {
      var side = sideOf(event);
      if (!side || dragging) {
        return;
      }
      event.preventDefault();
      dragging = side;
      if (svg.setPointerCapture) {
        svg.setPointerCapture(event.pointerId);
      }
      aim(event);
    });
    svg.addEventListener('pointermove', function(event) {
      if (dragging) {
        aim(event);
      }
    });
    svg.addEventListener('pointerup', function() { release(true); });
    svg.addEventListener('pointercancel', function() { release(false); });
    // Browsers that ignore touch-action inside a drawing: holding an ear
    // must not scroll the page.
    svg.addEventListener('touchstart', function(event) {
      if (sideOf(event)) {
        event.preventDefault();
      }
    }, { passive: false });
    svg.addEventListener('touchmove', function(event) {
      if (dragging) {
        event.preventDefault();
      }
    }, { passive: false });

    Array.prototype.forEach.call(presets, function(button) {
      button.addEventListener('click', function() {
        move({
          left: parseInt(button.dataset.left, 10),
          right: parseInt(button.dataset.right, 10)
        });
      });
    });

    draw();
    refreshControls();

    // The rabbit becomes busy or idle again when the radio starts or stops,
    // and ears may have been turned by hand while the page was in the
    // background.
    document.addEventListener('nabradio:status', function() {
      setTimeout(refresh, 1500);
    });
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        refresh();
      }
    });
  });
</script>
