{% load i18n %}
<div class="card" id="nabradio-settings">
  <form action="/nabradio/settings">
    {% csrf_token %}
    <div class="card-header">
      <h5 class="card-title">{% trans "Radio" %}</h5>
    </div>
    <div class="card-body">
      <p>{% trans "The radio service allows you to stream your favorite station. Configure the streaming URL and assign an RFID tag for quick activation." %}</p>
      <p>{% trans "To select a station, start typing in the search box below." %}</p>
      
      <!-- Affichage de la station actuellement configurée -->
      <div class="form-group row">
        <label for="radioStationInput" class="col-6 col-form-label">{% trans "Current Station" %}</label>
        <div class="col-6">
          <input id="radioStationInput" name="station_user_friendly" type="text" class="form-control" placeholder="{% trans "Station name or ID" %}" value="{{ config.station_user_friendly }}" disabled/>
        </div>
      </div>
      
      <!-- Sélecteur de station avec autocomplétion -->
      <div class="form-group row">
        <label for="stationSelect" class="col-6 col-form-label"></label>
        <div class="col-6">
          <select class="form-control basicAutoSelect" name="station"
                  placeholder="{% trans 'Search...' %}"
                  data-url="/nabradio/settings" autocomplete="off"></select>
        </div>
      </div>
      
      <!-- Champ pour l'URL de streaming -->
      <div class="form-group row">
        <label for="streamingUrlInput" class="col-6 col-form-label">{% trans "Streaming URL" %}</label>
        <div class="col-6">
          <input id="streamingUrlInput" name="streaming_url" type="text" class="form-control" placeholder="{% trans "Enter streaming URL" %}" value="{{ config.streaming_url }}"/>
        </div>
      </div>
      
      <!-- Champ pour l'identifiant RFID de la radio -->
      <div class="form-group row">
        <label for="radioUidInput" class="col-6 col-form-label">{% trans "RFID Tag" %}</label>
        <div class="col-6">
          <input id="radioUidInput" name="radio_uid" type="text" class="form-control" placeholder="{% trans "RFID tag" %}" value="{{ config.radio_uid }}"/>
        </div>
      </div>
      
      <!-- Bouton d'action, par exemple pour tester la lecture -->
      <div class="form-group row">
        <label class="col-6 col-form-label">{% trans "Action" %}</label>
        <div class="col-6">
          <button type="button" class="btn btn-primary now-button" data-action="play">{% trans "Play" %}</button>
        </div>
      </div>
      
    </div>
    <div class="card-footer">
      <div class="row mb-2">
        <div class="col-12">
          <button type="submit" class="btn btn-primary disabled ml-2 float-right save-button">{% trans "Save" %}</button>
          <button type="reset" class="btn btn-outline-primary disabled ml-2 float-right reset-button">{% trans "Reset" %}</button>
        </div>
      </div>
    </div>
  </form>

  <script>
      $(function () {
          $('.basicAutoSelect').autoComplete();
      });
  </script>

  <script type="text/javascript">
    $(function() {
      var form = $('#nabradio-settings form');
      var saveBtn = form.find('button.save-button');
      var resetBtn = form.find('button.reset-button');
      var url = form.attr('action');

      form.find('button.btn-toggle').on('click', function() {
        saveBtn.removeClass('disabled');
        resetBtn.removeClass('disabled');
      });
      form.find('.clockpicker').clockpicker();
      form.find('input').on('change', function() {
        saveBtn.removeClass('disabled');
        resetBtn.removeClass('disabled');
      });
      form.find('select').on('change', function() {
        saveBtn.removeClass('disabled');
        resetBtn.removeClass('disabled');
      });
      form.on('submit', function() {
        var formdata = form.serialize();
        $.ajax({
          url: url,
          method: "POST",
          data: formdata,
          success: function (data) {
            $("#nabradio-settings").replaceWith(data);
          },
          error: function (jqXHR, statusText, errorThrown) {
            form.find("#radioStationInput").removeClass('is-invalid');
            form.find(".invalid-feedback").remove();
            if (jqXHR.status == 406 && jqXHR.responseJSON.status == 'unknownStationError') {
              form.find("#radioStationInput").addClass('is-invalid');
              $('<div class="invalid-feedback">' + jqXHR.responseJSON.message + '</div>').insertAfter(form.find("#radioStationInput"));
            } else {
              $.bootstrapGrowl("{% trans "Unknown server error" %}", {type: 'danger', allow_dismiss: true});
            }
          }
        });
        return false;
      });
      resetBtn.on("click", function() {
        $.get(url, function(data) {
          $("#nabradio-settings").replaceWith(data);
        });
      });
      form.find('button.now-button').on("click", function() {
        var btn = $(this);
        btn.addClass('disabled');
        var action = btn.data('action');
        $.ajax({
          url: url,
          beforeSend: function (xhr, settings) {
            xhr.setRequestHeader("X-CSRFToken", form.find('input[name="csrfmiddlewaretoken"]').val());
          },
          data: {"action": action},
          method: "PUT",
          success: function (data) {
            btn.removeClass('disabled');
          }
        });
        return false;
      });
    });
  </script>
</div>
